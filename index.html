<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-canvas">
        <div id="heading-box">
            <h1>Number Guessing Game</h1>
        </div>
        <div id="input-field">
            <form id="user-input-field">
                <input id="user-input" type="text" placeholder="Enter Any Number Between (1 to 10)">
            </form>
        </div>

        <div id="answer-box">
            <p>Enter Number To Guess The Correct Number</p>
        </div>

        <div id="guess-queue">
            <p>Your Guesses :</p>
        </div>

        <div id="chances-block">
            <p>Chances Left : <span>0</span></p>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
